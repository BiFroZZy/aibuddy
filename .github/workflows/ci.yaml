name: PR Check

on:
  pull_request:
    branches: [ main, feat-backend, feat-frontend ]
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          working-directory: backend

      - name: Test with race detector and coverage
        run: go test -race -p 1 -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold (80%)
        run: |
          go tool cover -func=coverage.out | tee coverage.txt | tail -1
          total=$(tail -1 coverage.txt | awk '{print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { print "coverage " t "% is below 80%"; exit 1 } }'

      - name: Coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.txt
            backend/coverage.html

      - name: Build
        run: go build -v ./...
